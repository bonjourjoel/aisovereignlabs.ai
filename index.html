<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sovereign Labs</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-rendering: optimizeLegibility;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        p {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 2rem;
        }

        a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        a:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .dot {
            color: #333;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Sovereign Labs</h1>
        <p>Engineering the post-human era.</p>
        
        <nav>
            <a href="https://ai-code.ai">Main Project: AICode</a>
            <span class="dot">·</span>
            <a href="mailto:joel@aisovereignlabs.ai">Contact</a>
        </nav>
    </div>
</body>
</html>
