<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <meta property="og:title" content="AI Sovereign Labs">
    <meta property="og:description" content="Engineering the post-human era.">
    <title>AI Sovereign Labs</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            text-rendering: optimizeLegibility;
        }

        header {
            padding-top: 60px;
            text-align: center;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        footer {
            padding-bottom: 60px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .slogan {
            font-size: 0.9rem;
            color: #888;
        }

        .bullets-container {
            max-width: 600px;
            text-align: left;
            list-style: none;
            padding: 0;
        }

        .bullets-container li {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: #ccc;
            border-left: 2px solid #333;
            padding-left: 20px;
            transition: border-color 0.3s ease;
        }

        .bullets-container li:hover {
            border-color: #ffffff;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        a:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
    </style>
    <script>
        function openContactEmail() {
            // Anti-scraping technique
            const user = "joel";
            const domain = "aisovereignlabs";
            const tld = "ai";
            const fullAddress = user + "@" + domain + "." + tld;
            
            const anchor = document.getElementById("contact-link");
            anchor.href = "mai" + "lto" + ":" + fullAddress;
            anchor.textContent = fullAddress;
            
            // On le laisse cliquer naturellement sur le nouveau href
        }
    </script>
</head>
<body>
    <header>
        <h1>AI Sovereign Labs</h1>
        <p class="slogan">Engineering the post-human era.</p>
    </header>

    <main>
        <ul class="bullets-container">
            <li>The first sovereignty is the ability to read your own code.</li>
            <li>The second sovereignty is the ability to hide your own code.</li>
            <li>Be sovereign.</li>
        </ul>
    </main>

    <footer>
        <nav>
            <a href="https://ai-code.ai">Main Project: AICode</a>
            <a id="contact-link" href="javascript:openContactEmail()">Contact</a>
        </nav>
    </footer>
</body>
</html>
